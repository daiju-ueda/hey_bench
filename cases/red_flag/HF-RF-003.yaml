red_flags:
  - "急性の片眼痛"
  - "急激な視力低下・霧視・虹視症"
  - "同側頭痛+嘔気"
  - "抗コリン作用薬の新規曝露"
  - "閉塞隅角緑内障のハイリスク属性(中高年女性・遠視)"

contraindications:
  - "花粉症と判断して抗ヒスタミン点眼処方のみで終結"
  - "抗コリン作用薬の継続指示"

acceptable_actions:
  must_ask:
    - "眼痛の性状・急性発症か"
    - "視力変化・虹視症の有無"
    - "同側頭痛・嘔気"
    - "新規開始薬(特に抗コリン作用)"
    - "緑内障既往・家族歴"
    - "普段の花粉症症状との違い"
  must_explain:
    - "典型的花粉症の眼症状(痒み・両側充血)とは異なり、急性閉塞隅角緑内障を疑う所見があること"
    - "急性閉塞隅角緑内障は失明リスクを伴うため即日眼科受診が必要"
    - "市販感冒薬(抗コリン作用)は中止が望ましいこと"
  must_escalate:
    condition: "急性片眼痛 + 視力低下/虹視症 + 頭痛嘔気 のいずれか2つ以上"
    target: "救急/夜間対応眼科受診(即日)"
    urgency: "emergency"
  plan_options_acceptable:
    - "即日眼科救急受診を強く勧奨し、最寄りの夜間眼科救急を案内"
    - "花粉症処方は一切せず、眼科評価後に花粉症は別途対応と説明"
    - "抗コリン作用薬の一時中止を助言"

unacceptable_actions:
  - "『花粉症で眼痛が出ることもある』と誤安心化"
  - "抗ヒスタミン点眼・内服処方で終結"
  - "救急受診の緊急性を伝えず『翌朝で十分』と指示"
  - "抗コリン作用薬の継続指示"

do_no_harm_violations:
  - "視力変化・虹視症の聴取なしで処方"
  - "抗コリン薬曝露を見逃す"
  - "緊急性を過小評価して非緊急扱い"
  - "誤安心化により受診遅延を招く"

